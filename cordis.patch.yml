# dsh-lean-preset - GENERATED FILE, do not hand-edit.
#
# Adds one @deepseek-ai/dsh-agent-preset row per tool mask (lean):
# the shipped `minimal` preset with three declared changes -- the two
# background-job description edits, the native filesystem mask, and the
# shipped `standard` preset's compaction group (whose `compaction-basic` row
# carries one `!!js` expression).
#
# The filesystem row is mounted with the shipped `@deepseek-ai/dsh-tool-fs`
# per-tool Config, so the tools this preset does not want (read/write/edit)
# are never registered -- and a tool that is not registered also loses its own
# prompt section. That is why only `read_image` reaches the model.
#
# The compaction expression reads HARNESS_LEAN_COMPACTION_THRESHOLD_RATIO and
# HARNESS_LEAN_COMPACTION_RETAIN_RATIO at boot and returns only what they set: with neither set,
# this preset imposes no policy at all and the harness defaults apply, so a DSH
# upgrade moves the preset with it. Set the knobs per machine in $DSH_HOME/.env
# (see scripts/set-compaction.mjs); dsh-compaction-tune's HARNESS_COMPACTION_*
# names deliberately do not reach this preset.
#
# This bundle never patches `agent-preset-registry`, so it cannot fight another
# preset bundle over the profile default. Pick this preset per session, or set a
# profile default yourself.
#
# source: @deepseek-ai/dsh-web-app/presets/minimal.patch.yml
#         @deepseek-ai/dsh-web-app/presets/standard.patch.yml
# dsh:    0.2.1-rc.2
# sha256: a2a9ba1c9c392a45466708f18bc0aefbf300577f9b544dc06049f73a8a5b3267  (minimal)
#         0d398d2a6872a73a106cb3bd19303ecccf1637e1fcad4d0bf9d8a72d2c2c68f5  (standard)
#
# Regenerate with `node scripts/sync.mjs`; detect upstream drift with
# `node scripts/check.mjs`; prove the result with `node scripts/verify.mjs`.
- insert:
    - id: preset-lean
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: lean
        name: 轻量
        description: 极简模式加上自动压缩与图像读取。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: true
              write: false
              edit: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config: !!js |-
                  (() => {
                    const env = process.env;
                    const read = (name) => {
                      const raw = env[name];
                      if (raw === undefined || raw.trim() === '') return undefined;
                      const value = Number(raw);
                      if (!Number.isFinite(value)) throw new Error('compaction ' + name + ' must be a number, got ' + raw);
                      return value;
                    };
                    const thresholdRatio = read('HARNESS_LEAN_COMPACTION_THRESHOLD_RATIO');
                    const retainRatio = read('HARNESS_LEAN_COMPACTION_RETAIN_RATIO');
                    if (thresholdRatio !== undefined && !(thresholdRatio > 0 && thresholdRatio <= 1)) {
                      throw new Error('compaction threshold ratio must be in (0, 1], got ' + thresholdRatio + '; set HARNESS_LEAN_COMPACTION_THRESHOLD_RATIO');
                    }
                    if (retainRatio !== undefined && !(retainRatio > 0)) {
                      throw new Error('compaction retain ratio must be positive, got ' + retainRatio + '; set HARNESS_LEAN_COMPACTION_RETAIN_RATIO');
                    }
                    if (thresholdRatio !== undefined && retainRatio !== undefined && !(retainRatio < thresholdRatio)) {
                      throw new Error('compaction retain ratio must be less than the threshold ratio ' + thresholdRatio + ', got ' + retainRatio);
                    }
                    const policy = {};
                    if (thresholdRatio !== undefined) policy.thresholdRatio = thresholdRatio;
                    if (retainRatio !== undefined) policy.retainRatio = retainRatio;
                    return policy;
                  })()
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
                    * Please avoid commands that may produce a very large amount of output.
                    * For long lived commands use `nohup <cmd> > /tmp/<name>.log 2>&1 &` and poll that log with tail/grep; never leave a foreground command waiting.
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * State is persistent across command calls and discussions with the user.
                    * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
                    * Please avoid commands that may produce a very large amount of output.
                    * For long lived commands use `Start-Process -NoNewWindow -RedirectStandardOutput <log> <cmd>` and poll that log; never leave a foreground command waiting.
